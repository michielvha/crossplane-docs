apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: platform-mixed
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1beta1
    kind: XPlatform
  mode: Pipeline
  pipeline:
  - step: environment
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Reference
          ref:
            name: platform-defaults
  - step: compose
    functionRef:
      name: function-patch-and-transform
    input:
      apiVersion: pt.fn.crossplane.io/v1beta1
      kind: Resources
      patchSets:
      - name: region
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.region
          toFieldPath: data.region
      resources:
      - name: summary
        base:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: platform-summary
          data:
            region: ''
            capacity: ''
            storage: ''
        patches:
        - type: PatchSet
          patchSetName: region
        - type: FromCompositeFieldPath
          fromFieldPath: spec.capacity.replicas
          toFieldPath: data.capacity
          policy:
            fromFieldPath: Required
          transforms:
          - type: convert
            convert:
              toType: string
        - type: FromCompositeFieldPath
          fromFieldPath: spec.storage.sizeGiB
          toFieldPath: data.storage
          transforms:
          - type: math
            math:
              type: Multiply
              multiply: 2
          - type: convert
            convert:
              toType: string
        - type: CombineFromComposite
          combine:
            variables:
            - fromFieldPath: metadata.name
            - fromFieldPath: spec.region
            strategy: string
            string:
              fmt: '%s.%s.example.org'
          toFieldPath: data.endpoint
        - type: ToCompositeFieldPath
          fromFieldPath: data.region
          toFieldPath: status.observedRegion
        readinessChecks:
        - type: None
        connectionDetails:
        - name: region
          type: FromFieldPath
          fromFieldPath: data.region
  - step: networks
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- range $i, $network := .observed.composite.resource.spec.networks }}
          ---
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: {{ printf "%s-%s" $.observed.composite.resource.metadata.name $network.name }}
            annotations:
              {{ setResourceNameAnnotation (printf "network-%d" $i) }}
              gotemplating.fn.crossplane.io/ready: "True"
          data:
            cidr: {{ $network.cidr | quote }}
            region: {{ $.observed.composite.resource.spec.region | quote }}
            team: {{ index $.observed.composite.resource.spec.tags "team" | quote }}
            environment: {{ (index $.context "apiextensions.crossplane.io/environment").environment | quote }}
          {{- end }}
          ---
          apiVersion: platform.example.org/v1beta1
          kind: XPlatform
          status:
            phase: {{ if .observed.resources }}Ready{{ else }}Pending{{ end }}
            resourceCount: {{ len .observed.composite.resource.spec.networks }}
  - step: ready
    functionRef:
      name: function-auto-ready
